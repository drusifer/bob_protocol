[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bobp"
dynamic = ["version"]
description = "CLI front-end for the Bob Protocol multi-persona AI development framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4"
authors = [{ name = "Drew" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "Jinja2>=3.1",
    "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
dev = ["pytest", "build"]

[project.scripts]
bobp = "bobp.cli:main"

[project.urls]
Homepage = "https://github.com/drusifer/bob_protocol"
Repository = "https://github.com/drusifer/bob_protocol"

[tool.setuptools.dynamic]
version = { attr = "bobp.__version__" }

[tool.setuptools]
include-package-data = true

[tool.uv]
resolution = "highest"

[tool.setuptools.packages.find]
include = ["bobp*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
bobp = [
    "templates/**/*",
    "tools/*.json",
    "tools/mermaid_render/*.json",
    "tools/mermaid_render/*.mjs",
    "tools/persona_eval_assets/*.json",
]
