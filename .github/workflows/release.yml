name: Release to PyPI

# Triggered by publishing a GitHub Release (tag it vX.Y.Z first, then draft
# a release from that tag). Requires a PyPI "trusted publisher" configured
# for this repo/workflow — see https://docs.pypi.org/trusted-publishers/.
# Not yet set up: this workflow will fail at the publish step until a PyPI
# project named `bobp` exists (or a pending publisher is registered) with
# this repo + workflow file authorized as a trusted publisher. No PyPI API
# token is needed either way — auth is OIDC-based.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
