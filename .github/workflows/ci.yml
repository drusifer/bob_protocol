name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs get a read-only token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bobp
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

      - name: Smoke-test the bobp CLI
        run: bobp --help

  secrets:
    # Server-side backstop for the local gitleaks pre-commit hook (which
    # --no-verify or a clone without hooks can skip). Scans full git history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version and checksum)
        env:
          GITLEAKS_VERSION: "8.26.0"
          GITLEAKS_SHA256: "32faa8a77f6ce4b483921072ea89f78a794ad1d96471f2ad6e01ad3b0ebafa00"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan git history for secrets
        run: ./gitleaks detect --source . --no-banner
